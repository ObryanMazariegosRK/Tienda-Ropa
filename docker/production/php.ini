; PHP en producción
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Subidas: igual que en desarrollo (App/docker/php/uploads.ini) y que nginx (80M)
upload_max_filesize = 20M
post_max_size = 80M
max_file_uploads = 20

; OPcache: el código no cambia dentro del contenedor (cada despliegue crea uno nuevo),
; así que no hace falta revisar los archivos en cada petición
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
