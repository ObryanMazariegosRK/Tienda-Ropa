server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Igual que post_max_size de PHP: 8 fotos de hasta 8 MB
    client_max_body_size 80M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fotos subidas: nombre único que nunca se reutiliza, el navegador las guarda 30 días
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSS, JS e imágenes de la tienda: 1 día (cambian con cada despliegue y no llevan versión en el nombre)
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "app" se resuelve con el DNS de Docker en cada petición: si el contenedor
        # se recrea (cada despliegue) y cambia de IP, nginx no se queda con la vieja
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Archivos ocultos (.env, .git...) nunca se sirven
    location ~ /\.(?!well-known) {
        deny all;
    }
}
