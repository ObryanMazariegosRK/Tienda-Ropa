; OPcache: guarda en memoria el PHP ya compilado para no recompilar Laravel en cada petición.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Revisa en cada petición si el archivo cambió: los cambios al código se ven al instante.
; En producción se puede poner validate_timestamps=0 (más rápido), pero entonces hay que
; reiniciar el contenedor "app" en cada despliegue para que tome el código nuevo.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
