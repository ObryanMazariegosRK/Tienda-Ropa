server {
    listen 80;
    index index.php index.html;
    server_name localhost;

    root /var/www/public;
    # Igual que post_max_size de PHP (App/docker/php/uploads.ini): 8 fotos de hasta 8 MB
    client_max_body_size 80M;

    # Fotos subidas: cada archivo tiene un nombre único que nunca se reutiliza,
    # así que el navegador puede guardarlas 30 días sin volver a pedirlas
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Se resuelve "app" con el DNS de Docker en cada petición (caché de 10 s): si el
        # contenedor app se recrea y cambia de IP, nginx no se queda con la vieja (error 502)
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}