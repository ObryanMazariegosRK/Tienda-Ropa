<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>Sin conexión - Amerishop</title>
    <style>
        /* Página independiente: la muestra el service worker sin internet, así que no carga nada externo */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #111111;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .caja { max-width: 340px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { margin: 22px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
        p { margin: 0 0 26px; color: #a1a1aa; line-height: 1.5; }
        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            background: #52d62f;
            color: #0c0c0d;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/icons/icono-192.png" alt="Amerishop">
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con la tienda. Revisa tu internet y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
