# =============================================================================
# PRODUCCIÓN. El de desarrollo es docker-compose.yml (ese no se toca).
#
# Las variables (${...}) se llenan en el panel (Coolify / Dokploy) o, en un despliegue
# manual, con un archivo: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Ver .env.production.example y docs/DESPLIEGUE.md.
#
# Diferencias con desarrollo: el código va dentro de la imagen, no hay phpMyAdmin ni
# Mailpit, y MySQL no tiene puertos abiertos hacia afuera.
# =============================================================================

x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-Amerishop}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Falta APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Falta APP_URL}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-tienda_ropa}
  DB_USERNAME: ${DB_USERNAME:-tienda}
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Amerishop}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
    restart: unless-stopped
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: app
    volumes:
      - storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy

  # Cierra las subastas vencidas cada minuto (routes/console.php)
  scheduler:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: scheduler
    volumes:
      - storage:/var/www/storage
    depends_on:
      - app

  # Único servicio que recibe tráfico: el panel (o el proxy) le pone el dominio y el HTTPS
  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - storage:/var/www/storage:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tienda_ropa}
      MYSQL_USER: ${DB_USERNAME:-tienda}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  storage:      # fotos subidas, logs y caché de Laravel
  mysql-data:   # la base de datos
